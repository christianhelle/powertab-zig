name: powertab-zig
base: core24
version: "0.1.0"
summary: Guitar tablature editor written in Zig
description: |
  PowerTab Zig is a high-performance guitar tablature editor inspired by the
  classic PowerTab Editor. Built in Zig with an immediate-mode rendering loop
  powered by raylib, it supports PowerTab (.ptb) and Guitar Pro (.gp3/.gp4/.gp5)
  file formats.

  Features:
    • Open, edit and save PowerTab (.ptb) files
    • Import Guitar Pro 3/4/5 (.gp3/.gp4/.gp5) files
    • Vim-style keyboard navigation (hjkl + arrow keys)
    • Undo/redo history
    • Multi-track display with guitar chord diagrams

grade: devel
confinement: strict

architectures:
  - build-on: amd64
  - build-on: arm64

apps:
  powertab-zig:
    command: bin/powertab-zig
    plugs:
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback

parts:
  zig:
    plugin: nil
    build-packages:
      - curl
      - xz-utils
    override-build: |
      ZIG_VERSION="0.14.0"
      ARCH="$(uname -m)"
      if [ "$ARCH" = "aarch64" ]; then
        ZIG_ARCH="aarch64"
      else
        ZIG_ARCH="x86_64"
      fi
      ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/zig-linux-${ZIG_ARCH}-${ZIG_VERSION}.tar.xz"
      curl -sL "$ZIG_URL" | tar -xJ -C /tmp/
      export PATH="/tmp/zig-linux-${ZIG_ARCH}-${ZIG_VERSION}:$PATH"
      echo "Zig version: $(zig version)"

  raylib:
    plugin: nil
    build-packages:
      - libraylib-dev
    stage-packages:
      - libraylib5
    after: [zig]

  powertab-zig:
    plugin: nil
    source: .
    build-packages:
      - libraylib-dev
    build-environment:
      - PATH: "/tmp/zig-linux-x86_64-0.14.0:$PATH"
    override-build: |
      zig build --release=safe
      install -Dm755 zig-out/bin/powertab-zig "$SNAPCRAFT_PART_INSTALL/bin/powertab-zig"
    after: [zig, raylib]
