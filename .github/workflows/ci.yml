name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Zig ${{ matrix.zig-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zig-version: ["0.14.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ matrix.zig-version }}

      - name: Run unit tests
        run: zig build test --summary all

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: windows-latest
            target: x86_64-windows
          - os: macos-latest
            target: aarch64-macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.14.0"

      - name: Install raylib (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libraylib-dev

      - name: Install raylib (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install raylib

      - name: Install raylib (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          vcpkg install raylib:x64-windows

      - name: Build (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: zig build --release=safe

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: zig build --release=safe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: powertab-zig-${{ matrix.os }}
          path: zig-out/bin/
          if-no-files-found: ignore
